<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact | Family Nest Care</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body data-page="contact.html"><div id="nav"></div>
<header class="banner"><div class="wrap"><h1>Book a free visit</h1><p>Tell us a little and we will call you within one working day.</p></div></header>
<section style="padding-top:56px"><div class="wrap split" style="align-items:start">
 <form id="f" novalidate>
  <div><label for="n">Your name</label><input id="n" autocomplete="name"><div class="err" id="en"></div></div>
  <div><label for="p">Phone or email</label><input id="p"><div class="err" id="ep"></div></div>
  <div><label for="s">Care needed</label><select id="s"><option>Childcare</option><option>Elderly care</option><option>Both</option></select></div>
  <div><label for="m">Anything we should know?</label><textarea id="m" rows="3"></textarea></div>
  <button class="btn" type="submit">Request my visit</button><div class="ok" id="ok"></div>
 </form>
 <div class="info"><h3>Visit or call us</h3><p>📍 12 Garden Road, Sample City</p><p>📞 +00 123 456 789</p><p>✉️ hello@familynest.example</p><p>🕖 Monday to Saturday, 7am to 7pm</p><p>Prefer a chat first? Call us and we will answer all your questions.</p></div>
</div></section>
<section class="alt"><div class="wrap" style="max-width:780px"><h2>Common questions</h2><div id="fq"></div></div></section>
<div id="foot"></div><button id="top" aria-label="Back to top">↑</button><script src="script.js"></script></body></html>
